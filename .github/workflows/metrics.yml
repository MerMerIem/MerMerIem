name: Metrics
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MerMerIem
          template: classic
          base: header, activity, community, repositories, metadata
